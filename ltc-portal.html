<script>
/* =============================== 薪資計算 Payroll =============================== */
/* 參數為示意值：正式上線前請依當年度勞動部、勞保局、健保署、財政部公告更新 */
const PAY_CFG = {
  minMonthly:29500, minHourly:196,          // 2026 基本工資
  fullAttBonus:2000,                         // 全勤獎金（全職）
  taxThreshold:88501, taxRate:0.05,          // 薪資扣繳：超過門檻以 5% 預扣（簡化）
  avgDep:0.56,                               // 健保雇主負擔平均眷口數
  laborRate:0.125, healthRate:0.0517, pensionER:0.06,
  eveRate:200, nightRate:400,                // 夜班津貼（每班）
  nightInOTBase:true                         // 夜班津貼屬經常性給與，計入加班費時薪基準
};
const HOURLY_WAGE = {E2107:220, E2206:215};  // 部分工時人員時薪
const HOLIDAYS = {'2026-09-25':'中秋節','2026-09-28':'教師節','2026-10-09':'國慶日補假','2026-10-26':'光復節補假'};
const PENSION_GRADES = HEALTH_GRADES.filter(g=>g<=150000);
const PAY_MONTHS = ['2026-06','2026-07','2026-08','2026-09'];
const OT_TIERS = [
  {k:'wd1', zh:'平日加班（前 2 小時）',     en:'Weekday OT, first 2h',  mult:4/3, f:'4/3'},
  {k:'wd2', zh:'平日加班（第 3–4 小時）',   en:'Weekday OT, hours 3–4', mult:5/3, f:'5/3'},
  {k:'rd1', zh:'休息日（前 2 小時）',       en:'Rest day, first 2h',    mult:4/3, f:'4/3'},
  {k:'rd2', zh:'休息日（第 3–8 小時）',     en:'Rest day, hours 3–8',   mult:5/3, f:'5/3'},
  {k:'rd3', zh:'休息日（第 9–12 小時）',    en:'Rest day, hours 9–12',  mult:8/3, f:'8/3'},
  {k:'hol', zh:'國定假日／例假出勤（加倍）', en:'Holiday work (double)', mult:1,   f:'1（加發一倍）'}
];
const DEDUCT_LEAVES = ['sick','personal','family','menstrual'];
const PAY_GROUPS = {
  earn:{zh:'加項',en:'Earnings'}, att:{zh:'差勤扣款',en:'Attendance deductions'},
  stat:{zh:'法定代扣',en:'Statutory withholding'}, other:{zh:'其他扣款',en:'Other deductions'}, er:{zh:'雇主負擔（不自薪資扣除）',en:'Employer cost (not deducted)'}
};
const monthEnd = month => { const [y,m]=month.split('-').map(Number); return month+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); };
const stamp = () => ymd(TODAY)+' '+nowHM();
const empName = id => empRecord(id).basic.name;

function payrun(month){
  state.payruns = state.payruns || {};
  return state.payruns[month] || (state.payruns[month] = {versions:[], adj:{}, log:[], locked:false});
}
function dayType(date){
  if(HOLIDAYS[date]) return 'hol';
  const d=new Date(date+'T00:00').getDay();
  return d===0 ? 'hol' : d===6 ? 'rest' : 'wd';
}
/* 每筆加班依當日類別切分倍率級距 */
function splitOT(o){
  const h=o.hours, t=dayType(o.date), out={};
  if(t==='wd'){ out.wd1=Math.min(h,2); out.wd2=Math.max(0,h-2); }
  else if(t==='rest'){ out.rd1=Math.min(h,2); out.rd2=Math.min(Math.max(0,h-2),6); out.rd3=Math.max(0,h-8); }
  else { out.hol=Math.min(h,8); out.wd1=Math.min(Math.max(0,h-8),2); out.wd2=Math.max(0,h-10); }
  return {t, out, over: (t==='wd'&&h>4)||(t!=='wd'&&h>12)};
}

/* 從已核准差勤紀錄帶入計算參數 */
function payInputs(empId, month){
  const p=person(empId), rec=empRecord(empId), [y,m]=month.split('-').map(Number);
  const mS=month+'-01', mE=monthEnd(month), part=p.type==='part';
  const inp={empId, month, part, monthly:part?0:p.salary, hourly:part?(HOURLY_WAGE[empId]||PAY_CFG.minHourly):0,
    regH:0, wd1:0, wd2:0, rd1:0, rd2:0, rd3:0, hol:0, compH:0, leave:{}, lateMin:0, lateDays:0, missing:0,
    eve:0, night:0, eveRate:PAY_CFG.eveRate, nightRate:PAY_CFG.nightRate, nightInBase:PAY_CFG.nightInOTBase, shiftDates:{eve:[],night:[]},
    bonus:!part, laborG:0, healthG:0, pensionG:0, dep:rec.dep, selfPct:rec.selfPension,
    adjust:(payrun(month).adj[empId]||[]).slice(), pending:0, otOver:[], sources:[]};
  LEAVE.filter(l=>l.emp===empId&&l.status==='approved'&&l.from<=mE&&l.to>=mS).forEach(l=>{
    const h=leaveHours(l.from<mS?mS:l.from, l.from<mS?SHIFT.start:l.fromT, l.to>mE?mE:l.to, l.to>mE?SHIFT.end:l.toT, empId);
    inp.leave[l.type]=(inp.leave[l.type]||0)+h; inp.sources.push(l.id);
  });
  attendance(empId,y,m).filter(r=>r.status).forEach(r=>{
    if(r.status==='late' && !r.lvH){ inp.lateMin+=Math.max(0,minDiff(r.in,SHIFT_TYPES[r.shift].start)); inp.lateDays++; }
    if(r.status==='miss') inp.missing++;
    if(r.shift==='eve'||r.shift==='night'){ inp[r.shift]++; inp.shiftDates[r.shift].push(r.d); }
    if(part && ['present','late','miss'].includes(r.status)){
      const w = r.status==='miss' ? WORK_DAY_H : Math.min(WORK_DAY_H, workedHours(r.in,r.out,r.shift));
      inp.regH += Math.max(0, w-(r.lvH||0));
    }
  });
  OT_REQ.filter(o=>o.emp===empId&&o.status==='approved'&&o.date.startsWith(month)).forEach(o=>{
    inp.sources.push(o.id);
    if(o.comp==='comp'){ inp.compH+=o.hours; return; }
    const s=splitOT(o); Object.entries(s.out).forEach(([k,v])=>inp[k]+=v);
    if(s.over) inp.otOver.push(o.id);
  });
  PUNCH_FIX.filter(f=>f.emp===empId&&f.status==='approved'&&f.date.startsWith(month)).forEach(f=>inp.sources.push(f.id));
  inp.pending=[...LEAVE,...OT_REQ,...PUNCH_FIX].filter(x=>x.emp===empId&&(x.status==='pending'||x.status==='countersign')&&(x.from||x.date).slice(0,7)===month).length;
  inp.bonus = !part && inp.lateMin===0 && !Object.keys(inp.leave).some(k=>LEAVE_TYPES[k].att&&inp.leave[k]>0);
  const ev=rec.ins.filter(x=>x.date<=mE).slice(-1)[0];
  if(ev && ev.kind!=='quit'){ inp.laborG=ev.labor; inp.healthG=ev.health; }
  inp.pensionG = inp.laborG ? gradeFor(part ? inp.hourly*WORK_DAY_H*22 : p.salary, PENSION_GRADES) : 0;
  return inp;
}

/* 純計算：輸入 → 明細、應發、代扣、實發、雇主負擔 */
function payMath(inp){
  const H = inp.part ? +inp.hourly : +inp.monthly/240;
  const Hs = H.toFixed(2), n = v => (Math.round(v*100)/100).toLocaleString('en-US');
  const lines=[], add=(g,zh,en,formula,amt)=>{ const a=Math.round(amt); if(a||g==='earn') lines.push({g,zh,en,formula,amt:a}); return a; };
  const warn=[];
  let base, ot=0, att=0, paidLeave=0, bonus=0, adjPos=0, adjNeg=0;
  const eveN=+inp.eve||0, nightN=+inp.night||0, nightAmt=eveN*(+inp.eveRate||0)+nightN*(+inp.nightRate||0);
  const inBase = inp.nightInBase && nightAmt>0 && (!inp.part || +inp.regH>0);
  const Hot = !inBase ? H : inp.part ? (inp.regH*H+nightAmt)/inp.regH : (+inp.monthly+nightAmt)/240, HotS = Hot.toFixed(2);
  base = inp.part ? add('earn','正常工時薪資','Regular hours pay',`${fmtH(inp.regH)} 小時 × 時薪 ${n(H)}`, inp.regH*H)
                  : add('earn','本薪（月薪）','Base salary',`月薪 ${n(inp.monthly)}；時薪基準 = 月薪 ÷ 30 ÷ 8 = ${Hs}`, +inp.monthly);
  let night=0;
  if(eveN) night+=add('earn','小夜班津貼','Evening shift allowance',`${eveN} 班 × ${n(+inp.eveRate)}`, eveN*inp.eveRate);
  if(nightN) night+=add('earn','大夜班津貼','Overnight shift allowance',`${nightN} 班 × ${n(+inp.nightRate)}`, nightN*inp.nightRate);
  const otBase = !inBase ? '' : inp.part
    ? `（加班時薪基準 = (正常工時薪資 ${n(inp.regH*H)} + 夜班津貼 ${n(nightAmt)}) ÷ ${fmtH(+inp.regH)} 小時）`
    : `（加班時薪基準 = (月薪 + 夜班津貼 ${n(nightAmt)}) ÷ 240）`;
  OT_TIERS.forEach(t=>{ const h=+inp[t.k]||0; if(h>0) ot+=add('earn',t.zh,t.en,`${fmtH(h)} 小時 × ${HotS} × ${t.f}${otBase}`, h*Hot*t.mult); });
  Object.entries(inp.leave||{}).forEach(([k,h])=>{
    const t=LEAVE_TYPES[k]; h=+h; if(!h) return;
    if(inp.part){ if(t.pay>0) paidLeave+=add('earn',`${t.zh}（${t.pay===1?'給薪':'半薪'}）`,`${t.en} leave (${t.pay===1?'paid':'half pay'})`,`${fmtH(h)} 小時 × ${Hs} × ${t.pay}`, h*H*t.pay); }
    else if(t.pay<1) att+=add('att',`${t.zh}扣薪（${t.pay===0?'不給薪':'半薪'}）`,`${t.en} leave (${t.pay===0?'unpaid':'half pay'})`,`${fmtH(h)} 小時 × ${Hs} × ${1-t.pay}`, h*H*(1-t.pay));
  });
  if(+inp.lateMin>0) att+=add('att','遲到扣款（按實際分鐘）','Late arrival (actual minutes)',`${inp.lateMin} 分鐘 ÷ 60 × ${Hs}`, inp.lateMin/60*H);
  if(!inp.part) bonus = inp.bonus ? add('earn','全勤獎金','Full-attendance bonus','本月無遲到、病假、事假', PAY_CFG.fullAttBonus)
    : (lines.push({g:'earn',zh:'全勤獎金（未符合）',en:'Full-attendance bonus (not met)',formula:'本月有遲到、病假或事假',amt:0}),0);
  (inp.adjust||[]).forEach(a=>{ const v=+a.amount||0;
    if(v>=0) adjPos+=add('earn','人工調整：'+a.label,'Manual: '+a.label,a.reason||'',v);
    else adjNeg+=add('other','人工調整：'+a.label,'Manual: '+a.label,a.reason||'',-v); });
  const gross = base+night+ot+paidLeave+bonus+adjPos-att;
  const regular = (inp.part ? inp.regH*H : +inp.monthly)+night;
  if(inp.laborG && gradeFor(regular,LABOR_GRADES)>inp.laborG) warn.push({zh:`勞保投保薪資 ${inp.laborG} 低於本月經常性薪資（含夜班津貼）${Math.round(regular)} 的級距 ${gradeFor(regular,LABOR_GRADES)}`,
    en:`Labor insured salary ${inp.laborG} is below the bracket for regular pay incl. shift allowance (${gradeFor(regular,LABOR_GRADES)})`,cls:'warn'});
  const labor = inp.laborG ? add('stat','勞保費（個人負擔）','Labor insurance (employee)',`投保薪資 ${n(inp.laborG)} × 12.5% × 20%`, laborPremium(+inp.laborG)) : 0;
  const health = inp.healthG ? add('stat','健保費（個人負擔）','Health insurance (employee)',`投保金額 ${n(inp.healthG)} × 5.17% × 30% × (1 + 眷屬 ${Math.min(+inp.dep,3)})`, healthPremium(+inp.healthG,+inp.dep)) : 0;
  const pension = +inp.selfPct ? add('stat','勞退自提','Voluntary pension',`提繳工資 ${n(inp.pensionG)} × ${inp.selfPct}%`, inp.pensionG*inp.selfPct/100) : 0;
  const taxable = gross-pension;
  const tax = taxable>PAY_CFG.taxThreshold ? add('stat','薪資所得扣繳','Income tax withheld',`(應發 − 勞退自提) ${n(taxable)} × 5%（超過 ${n(PAY_CFG.taxThreshold)}）`, taxable*PAY_CFG.taxRate) : 0;
  const stat = labor+health+pension+tax;
  const net = gross-stat-adjNeg;
  const erL = add('er','勞保費（雇主 70%）','Labor insurance (employer)',`${n(inp.laborG)} × 12.5% × 70%`, inp.laborG*PAY_CFG.laborRate*0.7);
  const erH = add('er','健保費（雇主 60%）','Health insurance (employer)',`${n(inp.healthG)} × 5.17% × 60% × (1 + ${PAY_CFG.avgDep})`, inp.healthG*PAY_CFG.healthRate*0.6*(1+PAY_CFG.avgDep));
  const erP = add('er','勞退提繳（雇主 6%）','Pension (employer 6%)',`${n(inp.pensionG)} × 6%`, inp.pensionG*PAY_CFG.pensionER);
  if(inp.part && H<PAY_CFG.minHourly) warn.push({zh:`時薪低於基本工資 ${PAY_CFG.minHourly}`,en:`Hourly rate below minimum ${PAY_CFG.minHourly}`,cls:'crit'});
  if(!inp.part && +inp.monthly<PAY_CFG.minMonthly) warn.push({zh:'月薪低於基本工資',en:'Monthly pay below minimum wage',cls:'crit'});
  if(inp.missing) warn.push({zh:`未打卡 ${inp.missing} 筆未補登`+(inp.part?'（以 8 小時暫計）':''),en:`${inp.missing} missing punch(es) unresolved`,cls:'warn'});
  if(inp.pending) warn.push({zh:`${inp.pending} 筆差勤申請未核准，未納入`,en:`${inp.pending} request(s) not yet approved — excluded`,cls:'warn'});
  if((inp.otOver||[]).length) warn.push({zh:'加班超過單日上限：'+inp.otOver.join('、'),en:'Overtime above daily cap: '+inp.otOver.join(', '),cls:'crit'});
  const otH=OT_TIERS.reduce((a,t)=>a+(+inp[t.k]||0),0)+(+inp.compH||0);
  if(otH>OT_MONTH_CAP_H) warn.push({zh:`本月加班 ${fmtH(otH)} 小時，超過 ${OT_MONTH_CAP_H} 小時上限`,en:`Overtime ${fmtH(otH)}h exceeds ${OT_MONTH_CAP_H}h cap`,cls:'crit'});
  if(net<0) warn.push({zh:'實發為負數',en:'Net pay is negative',cls:'crit'});
  return {H, Hot, eveN, nightN, lines, base, night, ot, att, paidLeave, bonus, adjPos, adjNeg, adjNet:adjPos-adjNeg, gross, labor, health, pension, tax, stat, net,
    er:{labor:erL, health:erH, pension:erP, total:erL+erH+erP}, warn};
}

function payTotals(res){

function calcDefaults(empId, month){
  if(!empId) return {empId:'', month, part:false, monthly:40000, hourly:PAY_CFG.minHourly, regH:0, wd1:0, wd2:0, rd1:0, rd2:0, rd3:0, hol:0,
    lv_sick:0, lv_personal:0, lv_family:0, lv_menstrual:0, lv_paid:0, lateMin:0, bonus:true,
    eve:0, night:0, eveRate:PAY_CFG.eveRate, nightRate:PAY_CFG.nightRate, nightInBase:PAY_CFG.nightInOTBase, laborG:gradeFor(40000,LABOR_GRADES), healthG:gradeFor(40000,HEALTH_GRADES), dep:0, selfPct:0, addAmt:0, dedAmt:0};
  const i=payInputs(empId, month), c={...i};
  DEDUCT_LEAVES.forEach(k=>c['lv_'+k]=i.leave[k]||0);
  c.lv_paid=Object.entries(i.leave).filter(([k])=>!DEDUCT_LEAVES.includes(k)).reduce((a,[,h])=>a+h,0);
  c.addAmt=i.adjust.filter(a=>a.amount>0).reduce((a,x)=>a+x.amount,0);
  c.dedAmt=-i.adjust.filter(a=>a.amount<0).reduce((a,x)=>a+x.amount,0);
  return c;
}
function calcToInput(c){
  const leave={}; DEDUCT_LEAVES.forEach(k=>{ if(+c['lv_'+k]) leave[k]=+c['lv_'+k]; }); if(+c.lv_paid) leave.annual=+c.lv_paid;
  const adjust=[]; if(+c.addAmt) adjust.push({label:'其他加項',amount:+c.addAmt,reason:''}); if(+c.dedAmt) adjust.push({label:'其他減項',amount:-c.dedAmt,reason:''});
  const pensionG = +c.laborG ? gradeFor(c.part ? c.hourly*WORK_DAY_H*22 : +c.monthly, PENSION_GRADES) : 0;
  return {...c, part:c.part===true||c.part==='true', leave, adjust, pensionG, missing:0, pending:0, otOver:[], compH:0};
}

BINDERS['pay:calc']=function(){
  const f=document.getElementById('calcForm'); if(!f) return;
  const month=()=>f.month.value;
  const draw=()=>{
    if(f.empId.value!==(state.calcInp.empId||'')){ state.calcEmp=f.empId.value; state.calcInp=calcDefaults(f.empId.value, month()); render(); return; }
    const c={...state.calcInp}, el=k=>f.elements[k].value;
    ['monthly','hourly','regH','wd1','wd2','rd1','rd2','rd3','hol','lv_sick','lv_personal','lv_family','lv_menstrual','lv_paid','lateMin','laborG','healthG','dep','selfPct','addAmt','dedAmt','eve','night','eveRate','nightRate']
      .forEach(k=>c[k]=Math.max(0,+el(k)||0));
    c.part=el('part')==='true'; c.bonus=el('bonus')==='true'; c.nightInBase=el('nightInBase')==='true';
    f.monthly.disabled=c.part; f.hourly.disabled=!c.part; f.regH.disabled=!c.part;
    state.calcInp=c;
    const r=payMath(calcToInput(c));
    document.getElementById('calcHead').textContent = c.empId ? `${c.empId} ${empName(c.empId)} · ${month()}` : both('自訂','Custom');
    document.getElementById('calcOut').innerHTML = `
      <div class="tiles" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
        <div class="tile"><span class="k">${esc(both('應發','Gross'))}</span><span class="v" style="font-size:18px">${money(r.gross)}</span></div>
        <div class="tile"><span class="k">${esc(both('實發','Net'))}</span><span class="v" style="font-size:18px">${money(r.net)}</span></div>
        <div class="tile"><span class="k">${esc(both('公司成本','Labor cost'))}</span><span class="v" style="font-size:18px">${money(r.gross+r.er.total)}</span></div>
      </div>
      ${r.warn.length?`<div class="note q" style="margin-bottom:10px">${r.warn.map(w=>esc(both(w.zh,w.en))).join('<br>')}</div>`:''}
      ${payLinesHTML(r)}`;
  };
  f.oninput=draw; f.onchange=e=>{
    if(e.target.name==='empId'||e.target.name==='month'){ state.calcEmp=f.empId.value; state.calcMonth=month(); state.calcInp=calcDefaults(f.empId.value, month()); render(); return; }
    draw();
  };
  f.querySelector('[data-reload]').onclick=()=>{ state.calcInp=calcDefaults(f.empId.value, month()); render(); };
  draw();
};

        <thead><tr><th>${bi('版本','Ver.')}</th><th>${bi('建立','Created')}</th><th>${bi('應發','Gross')}</th><th>${bi('實發','Net')}</th><th>${bi('警示','Flags')}</th><th>${bi('狀態','Status')}</th><th></th></tr></thead>

          <td class="num">${money(v.totals.gross)}</td><td class="num">${money(v.totals.net)}</td><td class="num">${v.totals.warn}</td>

  const month=state.payMonth||'2026-08', run=payrun(month), last=run.versions.slice(-1)[0];
  document.getElementById('verMonth').onchange=e=>{ state.payMonth=e.target.value; render(); };
  document.querySelectorAll('[data-vcsv]').forEach(b=>b.onclick=()=>{ const v=run.versions[+b.dataset.vcsv-1]; downloadCSV(payCSV(v.res,month), `薪資清冊_${month}_v${v.v}.csv`); });
  document.querySelectorAll('[data-vact]').forEach(b=>b.onclick=()=>{
    const act=b.dataset.vact;
    if(act==='submit'){ last.status='submitted'; run.log.push({at:stamp(), by:me().id, act, v:last.v, note:''}); toast(both('v'+last.v+' 已送出覆核','v'+last.v+' submitted for review')); render(); return; }
    const needNote = act!=='approve';
    document.getElementById('vactForm').innerHTML=`<form class="frm card-b" id="vf" style="border-top:1px solid var(--line)">
      <div><label>${esc(act==='approve'?both('覆核意見（選填）','Review comment (optional)'):act==='return'?both('退回原因（必填）','Reason for returning (required)'):both('解除鎖定原因（必填）','Reason for unlocking (required)'))}</label>
        <input name="note" ${needNote?'required minlength="4"':''}></div>
      <div><button class="btn mini" type="submit">${esc(both('確認','Confirm'))}</button></div></form>`;
    document.getElementById('vf').onsubmit=e=>{ e.preventDefault(); const note=new FormData(e.target).get('note').trim();
      if(act==='approve'){ last.status='approved'; last.reviewBy=me().id; run.locked=true; }
      if(act==='return'){ last.status='returned'; last.reviewBy=me().id; }
      if(act==='unlock'){ run.locked=false; }
      run.log.push({at:stamp(), by:me().id, act, v:last.v, note});
      toast(both({approve:'已覆核並鎖定',return:'已退回',unlock:'已解除鎖定'}[act], {approve:'Approved and locked',return:'Returned',unlock:'Unlocked'}[act])); render(); };
  });
};

];
const BUILT_ROLES = ['admin','hr','manager'];
const PERM_DEFAULTS = Object.fromEntries(BUILT_ROLES.map(k=>[k,{...ROLES[k].perms}]));
function capMark(c, k){
  if(!c.key) return c[k];
  const r=ROLES[k]; return r.perms[c.key] ? (r.allOffices ? 'yes' : 'own') : 'no';
}
const CAPMARK={
  yes:{zh:'可',en:'Yes',cls:'yes'}, no:{zh:'不可',en:'No',cls:'no'},
  own:{zh:'限本院',en:'Own facility',cls:'partial'}, assume:{zh:'預設不可（可調整）',en:'No by default (toggle)',cls:'partial'}
};
function viewMatrix(){
  const admin=can('perms'), cols=admin?BUILT_ROLES:[state.role];
  const log=state.permLog||[];
  const changed=BUILT_ROLES.some(k=>Object.keys(PERM_DEFAULTS[k]).some(p=>ROLES[k].perms[p]!==PERM_DEFAULTS[k][p]));
  const cell=(c,k)=>{ const v=CAPMARK[capMark(c,k)];
    const label=`<span class="${v.cls}">${esc(both(v.zh,v.en))}</span>`;
    if(!admin||!c.key||c.derived) return `<td style="text-align:center">${label}</td>`;
    const on=!!ROLES[k].perms[c.key], self=k===state.role&&c.key==='perms';
    return `<td style="text-align:center"><label style="display:inline-flex;gap:6px;align-items:center;cursor:${self?'not-allowed':'pointer'}">
      <input type="checkbox" data-perm="${k}|${c.key}" ${on?'checked':''} ${self?'disabled title="'+esc(both('不可移除自己的管理權限','You cannot remove your own admin permission'))+'"':''}>${label}</label></td>`;
  };
  return `
  <div class="grid">
    <div class="note">${admin ? esc(both(
      '本表即原型實際使用的權限設定。勾選或取消即時生效（僅限本次瀏覽），可切換上方「身分」驗證畫面差異。',
      'This matrix is the permission set the prototype actually runs on. Ticking a box takes effect immediately (this browser session only); switch the Role selector above to check each view.'))
      : esc(both('完整權限對照表僅系統管理員可檢視與調整；以下為您目前身分的權限。',
      'Only the system administrator can view and change the full matrix; below are the permissions for your current role.'))}</div>
    <section class="card">
      <div class="card-h"><h2>${esc(admin?both('權限對照表','Permission matrix'):both('我的權限','My permissions'))}</h2>
        <span class="en">${esc(both(cols.length+' 種身分 · '+CAPS.length+' 項權限',cols.length+' role(s) · '+CAPS.length+' capabilities'))}</span>
        <div class="spacer" style="flex:1"></div>
        ${admin&&changed?`<button class="btn ghost mini" data-permreset>${esc(both('還原預設','Restore defaults'))}</button>`:''}</div>
      <div class="tablewrap"><table class="permtable">
        <thead><tr><th>${bi('權限項目','Capability')}</th>
          ${cols.map(k=>`<th style="text-align:center">${bi(ROLES[k].zh,ROLES[k].en)}</th>`).join('')}</tr></thead>
        <tbody>${CAPS.map(c=>`<tr>
          <td>${bi(c.zh,c.en)}${c.note?`<div class="muted" style="font-size:11px">${esc(both(c.note.zh,c.note.en))}</div>`:''}</td>
          ${cols.map(k=>cell(c,k)).join('')}
        </tr>`).join('')}</tbody></table></div>
      <div class="legend">${esc(both(
        '「限本院」= 僅限使用者所屬據點；「預設不可（可調整）」= 由上方假設開關控制。資料範圍列由身分決定，不在此調整。',
        '"Own facility" = limited to the user’s own site; "No by default (toggle)" = controlled by the Assumption switch. Data-scope rows follow the role and are not edited here.'))}</div>
    </section>
    ${admin&&log.length?`<section class="card">
      <div class="card-h"><h2>${esc(both('權限異動紀錄','Permission change log'))}</h2></div>
      <div class="tablewrap"><table><thead><tr><th>${bi('時間','Time')}</th><th>${bi('身分','Role')}</th><th>${bi('權限','Capability')}</th><th>${bi('異動','Change')}</th></tr></thead>
        <tbody>${log.slice().reverse().map(l=>`<tr><td class="mono" style="font-size:12px">${l.at}</td><td>${esc(both(ROLES[l.role].zh,ROLES[l.role].en))}</td>
          <td>${esc(l.cap)}</td><td>${l.on?`<span class="chip ok">${esc(both('開啟','Granted'))}</span>`:`<span class="chip crit">${esc(both('移除','Removed'))}</span>`}</td></tr>`).join('')}</tbody></table></div>
    </section>`:''}
    <section class="card">
      <div class="card-h"><h2>${esc(both('目前登入身分對應的實際範圍','What the current role actually sees'))}</h2></div>
      <div class="card-b">
        <dl class="kv">
          <dt>${esc(both('身分','Role'))}</dt><dd>${esc(both(role().zh,role().en))}</dd>
          <dt>${esc(both('人員','Persona'))}</dt><dd>${esc(nameOf(me()))} · ${esc(L(TITLES[me().title]))} · ${esc(L(unit(me().unit)))}</dd>
          <dt>${esc(both('可讀據點','Facilities readable'))}</dt><dd>${scopeUnits().map(u=>esc(L(unit(u)))).join('、')}</dd>
          <dt>${esc(both('可讀人數','People readable'))}</dt><dd class="mono">${scopedStaff().length} / ${STAFF.length}</dd>
          <dt>${esc(both('薪資欄位','Pay fields'))}</dt><dd>${can('salary')?esc(both('可見','Visible')):`<span class="lock">${lockIcon()}${esc(both('隱藏','Hidden'))}</span>`}</dd>
        </dl>
      </div>
    </section>
  </div>`;
}
BINDERS['perm:matrix']=function(){
  document.querySelectorAll('[data-perm]').forEach(cb=>cb.onchange=()=>{
    if(!can('perms')) return;
    const [k,p]=cb.dataset.perm.split('|');
    if(k===state.role && p==='perms') return;
    const on=cb.checked;
    ROLES[k].perms[p]=on;
    const cap=CAPS.find(c=>c.key===p);
    (state.permLog=state.permLog||[]).push({at:ymd(TODAY)+' '+nowHM(), role:k, cap:both(cap.zh,cap.en), on});
    toast(both(ROLES[k].zh+'：'+cap.zh+(on?' 已開啟':' 已移除'), ROLES[k].en+': '+cap.en+(on?' granted':' removed')));
    render();
  });
  const r=document.querySelector('[data-permreset]');
  if(r) r.onclick=()=>{
    BUILT_ROLES.forEach(k=>Object.assign(ROLES[k].perms, PERM_DEFAULTS[k]));
    (state.permLog=state.permLog||[]).push({at:ymd(TODAY)+' '+nowHM(), role:state.role, cap:both('全部還原預設','All restored to defaults'), on:true});
    toast(both('權限已還原預設','Permissions restored to defaults')); render();
  };
};
