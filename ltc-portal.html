<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<!--#artifact-begin-->
<title>康禾長照營運入口 Kanghe Ops Portal</title>
<style>
:root{
  --ground:#F5F7F6; --surface:#FFFFFF; --surface-2:#EEF2F0; --rail:#12211D;
  --rail-ink:#CFDCD7; --rail-ink-dim:#8AA09A; --line:#DCE3E0; --line-strong:#C3CFCB;
  --ink:#16211E; --ink-2:#43534E; --ink-3:#6B7C77;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#DCEAE4; --accent-line:#A9CDC1;
  --ok:#2E7D4F; --ok-soft:#DFF0E5; --warn:#9A6410; --warn-soft:#FBEFD8; --warn-line:#E4C489;
  --crit:#A93A46; --crit-soft:#F8E3E5; --info:#2F5F7D; --info-soft:#E1ECF3;
  --shadow:0 1px 2px rgba(22,33,30,.06), 0 8px 24px -16px rgba(22,33,30,.35);
  --radius:8px;
  --sans:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1513; --surface:#151E1B; --surface-2:#1B2724; --rail:#0A100E;
    --rail-ink:#D3E0DB; --rail-ink-dim:#7A908A; --line:#28352F; --line-strong:#3A4A44;
    --ink:#E7EEEA; --ink-2:#B3C2BC; --ink-3:#869892;
    --accent:#57B99B; --accent-ink:#08201A; --accent-soft:#1C332C; --accent-line:#2F5A4C;
    --ok:#6FC98D; --ok-soft:#17301F; --warn:#E0B061; --warn-soft:#33280F; --warn-line:#5C481D;
    --crit:#E8909A; --crit-soft:#361B1F; --info:#8FBCD8; --info-soft:#14252F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1513; --surface:#151E1B; --surface-2:#1B2724; --rail:#0A100E;
  --rail-ink:#D3E0DB; --rail-ink-dim:#7A908A; --line:#28352F; --line-strong:#3A4A44;
  --ink:#E7EEEA; --ink-2:#B3C2BC; --ink-3:#869892;
  --accent:#57B99B; --accent-ink:#08201A; --accent-soft:#1C332C; --accent-line:#2F5A4C;
  --ok:#6FC98D; --ok-soft:#17301F; --warn:#E0B061; --warn-soft:#33280F; --warn-line:#5C481D;
  --crit:#E8909A; --crit-soft:#361B1F; --info:#8FBCD8; --info-soft:#14252F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.brand b{color:#fff;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--rail-ink-dim);letter-spacing:.04em}
.rail-group{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-ink-dim)}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--rail-ink);cursor:pointer;font-size:13.5px;white-space:nowrap}
.navitem:hover{background:rgba(255,255,255,.06)}
.navitem[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.navitem[disabled]{opacity:.42;cursor:not-allowed}
.navitem .en{font-size:10.5px;color:inherit;opacity:.6;margin-left:auto;font-family:var(--mono);flex:none}
.navdot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:var(--rail-ink-dim);line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.utility{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ufield{display:flex;align-items:center;gap:6px}
.ulabel{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
select,input[type=search],input[type=text]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px}
select[disabled]{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
.spacer{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg button+button{border-left:1px solid var(--line-strong)}

/* assumption toggle */
.assume{display:flex;align-items:center;gap:8px;border:1px dashed var(--warn-line);background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:4px 9px;cursor:pointer}
.assume b{font-weight:600;font-size:12px}
.assume small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.switch{width:30px;height:17px;border-radius:99px;background:var(--line-strong);position:relative;flex:none;transition:background .16s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.assume[aria-pressed="true"] .switch{background:var(--warn)}
.assume[aria-pressed="true"] .switch::after{transform:translateX(13px)}

.content{padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%}
.content-solo{padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px;max-width:900px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead h1{font-size:20px}
.pagehead .sub{color:var(--ink-3);font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:2px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tabs .ten{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:5px}

/* ---------- scope banner ---------- */
.scopebar{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius);border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:12.5px}
.scopebar.is-open{border-left-color:var(--warn);background:var(--warn-soft)}
.scopebar b{font-weight:600}
.scopebar .q{font-size:11.5px;color:var(--ink-2);display:block;margin-top:3px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:14px}
.card-h .en{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.card-b{padding:14px}
.grid{display:grid;gap:14px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:11px;color:var(--ink-3)}
.tile .v{font-size:22px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .d{font-size:11px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);font-style:normal}
.lock svg{width:11px;height:11px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-strong);font-weight:400}
.btn.mini{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:13px}
.bi{display:flex;flex-direction:column;line-height:1.25}
.bi .en{font-size:11px;color:var(--ink-3)}
</style>
<style>
/* ---------- announcements ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.annlist{display:flex;flex-direction:column}
.annrow{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;text-align:left;width:100%;border-top:0;border-right:0}
.annrow:hover{background:var(--surface-2)}
.annrow[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.annrow .t{font-weight:500;font-size:13.5px}
.annrow .t-en{font-size:11.5px;color:var(--ink-3)}
.annrow .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.annrow .date{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto;flex:none}
.anndetail .body{padding:14px;font-size:13.5px;line-height:1.75;color:var(--ink-2);white-space:pre-line}
.anndetail .body .zh{color:var(--ink);display:block;margin-bottom:10px;white-space:pre-line}
.pin{color:var(--warn)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.caldow{padding:6px 8px;font-size:11px;color:var(--ink-3);text-align:center;border-bottom:1px solid var(--line);letter-spacing:.04em}
.calday{min-height:82px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;background:none;text-align:left;cursor:pointer;border-top:0;border-left:0;color:inherit}
.calday:nth-child(7n){border-right:0}
.calday:hover{background:var(--surface-2)}
.calday[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.calday.out{background:var(--surface-2);color:var(--ink-3)}
.calday .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.calday .d.today{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 4px}
.ev{font-size:11px;border-radius:4px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid}
.ev.train{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.ev.audit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.ev.hr{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ev.event{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

/* ---------- org chart ---------- */
.orgwrap{overflow-x:auto;padding:18px 14px}
.orgtop{display:flex;flex-direction:column;align-items:center;gap:0}
.node{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 11px;min-width:150px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.node:hover{border-color:var(--accent);background:var(--accent-soft)}
.node .n{font-size:13px;font-weight:500}
.node .r{font-size:11px;color:var(--ink-3)}
.node.exec{background:var(--rail);color:#fff;border-color:var(--rail)}
.node.exec .r{color:var(--rail-ink-dim)}
.node.scoped{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.node.dim{opacity:.42}
.vline{width:1px;height:16px;background:var(--line-strong)}
.orgrow{display:flex;gap:12px;align-items:flex-start;justify-content:center;position:relative;padding-top:16px}
.orgrow::before{content:"";position:absolute;top:0;left:9%;right:9%;height:1px;background:var(--line-strong)}
.orgcol{display:flex;flex-direction:column;align-items:center;position:relative}
.orgcol::before{content:"";position:absolute;top:-16px;height:16px;width:1px;background:var(--line-strong)}
.orgcol .kids{display:flex;flex-direction:column;gap:5px;margin-top:14px;position:relative;width:100%}
.orgcol .kids::before{content:"";position:absolute;top:-14px;left:50%;height:14px;width:1px;background:var(--line-strong)}
.leaf{font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);text-align:left;cursor:pointer;color:var(--ink-2);font-family:inherit}
.leaf:hover{border-color:var(--accent);color:var(--ink)}

/* ---------- directory ---------- */
.dirgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));padding:14px}
.dircard{border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.dircard .n{font-weight:500}
.dircard .meta{font-size:11.5px;color:var(--ink-3)}
.dircard .rows{margin-top:6px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.dircard .rows span{display:flex;gap:6px}
.dircard .rows .lbl{color:var(--ink-3);min-width:52px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,20,18,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px -24px rgba(0,0,0,.6)}
.drawer-h{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer-b{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0}
.drawer.wide{width:min(860px,96vw)}
.drawer .tablewrap{max-width:100%}
.addbox{border:1px dashed var(--line-strong);border-radius:6px;padding:8px 12px}
.addbox summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:500}
.x{margin-left:auto;background:none;border:1px solid var(--line-strong);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--ink-2);line-height:1;flex:none}

/* ---------- attendance ---------- */
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:3px}
.attcell{aspect-ratio:1;border-radius:3px;background:var(--ok-soft);position:relative}
.attcell.late{background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn-line)}
.attcell.leave{background:var(--info-soft)}
.attcell.miss{background:var(--crit-soft);box-shadow:inset 0 0 0 1px var(--crit)}
.attcell.off{background:var(--surface-2)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:76px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.low{background:var(--warn)}

/* ---------- misc ---------- */
.note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:6px;padding:9px 12px;line-height:1.6}
.note.q{border-left-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--rail);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.permtable td:first-child{white-space:normal}
.permtable td{white-space:nowrap}
.yes{color:var(--ok);font-weight:600}
.no{color:var(--ink-3)}
.partial{color:var(--warn);font-weight:500}
/* ---------- forms ---------- */
.frm{display:grid;gap:12px}
.frm .row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.frm label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:4px}
.frm input,.frm select,.frm textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px}
.frm textarea{min-height:56px;resize:vertical}
.frm .calc{font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.frm .calc.bad{background:var(--crit-soft);color:var(--crit)}
.subnav{display:flex;flex-wrap:wrap;gap:6px}
.subnav button{background:var(--surface);border:1px solid var(--line-strong);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.subnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.clockface{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.clockface .now{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--warn)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 14px}
  .brand{padding:0 14px 0 4px}
  .rail-group,.rail-foot{display:none}
  .navitem{width:auto}
  .navitem .en{display:none}
  .split{grid-template-columns:1fr}
  .content{padding:16px 14px 60px}
  .utility{padding:10px 14px}
}
</style>
<!--#artifact-split-->
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast"></div>
<script>
/* =========================================================================
   康禾長照 營運入口 — 原型 (Kanghe Long-Term Care — Operations Portal prototype)

/* 特休天數（勞基法第 38 條） */
function annualDays(hired, asOf){
  const y=(asOf-new Date(hired))/31557600000;
  if(y<0.5) return 0; if(y<1) return 3; if(y<2) return 7; if(y<3) return 10; if(y<5) return 14; if(y<10) return 15;
  return Math.min(30, 15+Math.floor(y)-9);
}
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const roundUnit = h => Math.ceil(h/LEAVE_UNIT_H-1e-9)*LEAVE_UNIT_H;
/* 計算兩個時間點之間的「上班時數」（扣午休、跳過週六日）。
   有 empId 時依當日班別計算：小夜／大夜只計與該班重疊的時間；請假涵蓋整個白班時段（08:00–17:00）視為請整班 */
function leaveHours(fromD, fromT, toD, toT, empId){
  if(!fromD||!toD||!fromT||!toT) return 0;
  const s=new Date(fromD+'T00:00'), e=new Date(toD+'T00:00'); if(e<s) return 0;
  const blocks=[[toMin(SHIFT.start),toMin(SHIFT.lunchS)],[toMin(SHIFT.lunchE),toMin(SHIFT.end)]];
  let min=0;
  for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)){
    if(d.getDay()===0||d.getDay()===6) continue;
    const a = +d===+s ? toMin(fromT) : toMin(SHIFT.start);
    const b = +d===+e ? toMin(toT)   : toMin(SHIFT.end);
    const sh = empId && typeof shiftOf==='function' ? shiftOf(empId, ymd(d)) : 'day';
    if(sh==='day'){ blocks.forEach(([x,y])=>{ min+=Math.max(0, Math.min(b,y)-Math.max(a,x)); }); continue; }
    const x=toMin(SHIFT_TYPES[sh].start), y=toMin(SHIFT_TYPES[sh].end)||1440;
    min += (a<=toMin(SHIFT.start) && b>=toMin(SHIFT.end)) ? y-x : Math.max(0, Math.min(b,y)-Math.max(a,x));
  }
  return roundUnit(min/60);
}
/* 加班時數：跨午夜自動視為隔日 */
function spanHours(start, end){
  if(!start||!end) return 0;
  let m=toMin(end)-toMin(start); if(m<=0) m+=1440;
  return roundUnit(m/60);
}

<script>
/* ---------- roles & permissions ---------- */
/* v2.0: 9 roles per specification, but only 3 fully working in this prototype */
const ROLES = {
  /* --- Built (working in this prototype) --- */
  admin:{ id:'admin', zh:'系統管理員', en:'System Admin', persona:'E1005', allOffices:true, built:true,
    perms:{ salary:false, editEmp:true, mobile:true, approve:false, finalize:false,
            annGroup:true, annOffice:true, perms:true, exportAll:true } },
  hr:{ id:'hr', zh:'人資部經理', en:'HR Manager', persona:'E1003', allOffices:true, built:true,
    perms:{ salary:true, editEmp:true, mobile:true, approve:true, finalize:true,
            annGroup:true, annOffice:true, perms:false, exportAll:true } },
  manager:{ id:'manager', zh:'院長／單位主管', en:'Facility Director', persona:'E2101', allOffices:false, built:true,
    perms:{ salary:false, editEmp:false, mobile:false, approve:true, finalize:false,
            annGroup:false, annOffice:true, perms:false, exportAll:false } },

  /* --- Planned for Phase 2–3 (stubs only) --- */
  coo:{ id:'coo', zh:'營運長', en:'COO', built:false, phase:'Phase 1+' },
  finance:{ id:'finance', zh:'財務部經理', en:'Finance Manager', built:false, phase:'Phase 2' },
  nurse:{ id:'nurse', zh:'護理部主管', en:'Nursing Director', built:false, phase:'Phase 2' },
  care:{ id:'care', zh:'照護部主管', en:'Care Services Manager', built:false, phase:'Phase 2' },
  social:{ id:'social', zh:'社工室主任', en:'Social Work Supervisor', built:false, phase:'Phase 3' },
  company:{ id:'company', zh:'公司經理', en:'Company Manager', built:false, phase:'Phase 2' }
};

/* ---------- state ---------- */
const state = {
  lang:'zh', role:'admin', module:'arch', tab:'scope',
  crossOffice:false,          // ASSUMPTION TOGGLE: managers see all offices?
  office:'ALL',               // office filter within the allowed scope
  annId:'A09', calMonth:'2026-09', calDay:null,
  q:'', dirQ:'', empId:null, attMonth:'2026-08', attView:'summary', nodeId:null
};
const role = () => ROLES[state.role];
const me = () => person(role().persona);
const can = k => role().perms[k];
/* offices this role may read right now */
function scopeUnits(){
  const r = role();
  if(r.allOffices || state.crossOffice) return ALL_UNITS.map(u=>u.id);
  return [me().unit];
}
const inScope = uid => scopeUnits().includes(uid);
const scopedStaff = () => STAFF.filter(s=>inScope(s.unit));
/* offices offered in the office filter (HQ excluded from care-home filters) */
function filterUnits(){ return ALL_UNITS.filter(u=>inScope(u.id)); }
function activeUnitIds(){
  const allowed = scopeUnits();
  return state.office==='ALL' ? allowed : allowed.filter(id=>id===state.office);
}
const scopeLocked = () => !role().allOffices && !state.crossOffice;

/* ---------- i18n helpers ---------- */
const L = o => !o ? '' : (state.lang==='zh' ? o.zh : (o.en||o.zh));
const S = o => state.lang==='zh' ? (o.en||o.zh) : o.zh;      // secondary language
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* bilingual block: primary line + secondary line, always both languages */
const bi = (zh,en) => `<span class="bi"><span>${esc(state.lang==='zh'?zh:en)}</span><span class="en">${esc(state.lang==='zh'?en:zh)}</span></span>`;
const biO = o => bi(o.zh,o.en);
const both = (zh,en) => state.lang==='zh' ? `${zh} / ${en}` : `${en} / ${zh}`;
const nameOf = p => state.lang==='zh' ? p.zh : p.en;
const nameFull = p => state.lang==='zh' ? `${p.zh}` : `${p.en}`;
const money = n => 'NT$'+n.toLocaleString('en-US');

/* ---------- deterministic mock attendance ---------- */
function seed(str){ let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  h^=h>>>13; h=Math.imul(h,1540483477); h^=h>>>15;   // avalanche, so nearby ids don't correlate
  return (h>>>0)/4294967296; }
const ATT_STATUS = {
  present:{zh:'正常',en:'On time',cls:'ok'}, late:{zh:'遲到',en:'Late',cls:'warn'},
  leave:{zh:'請假',en:'On leave',cls:'info'}, miss:{zh:'未打卡',en:'Missing punch',cls:'crit'},
  off:{zh:'排休',en:'Rest day',cls:''}
};
function shiftOf(empId, date){
  const p=person(empId);
  if(!p || !ROTATING_TITLES.includes(p.title) || p.unit==='HQ') return 'day';
  const o=(state.roster||{})[empId+'|'+date]; if(o) return o;
  if(OT_REQ.some(x=>x.emp===empId&&x.date===date)) return 'day';
  const r=seed(empId+'|'+date+'|shift');
  return r<0.18 ? 'night' : r<0.45 ? 'eve' : 'day';
}
/* 假單時數在載入時尚無班別資料，這裡依班別重算 */
LEAVE.forEach(l=>{ l.hours=leaveHours(l.from,l.fromT,l.to,l.toT,l.emp); });
function attendance(empId, y, m){        // m = 1-12
  const days = new Date(y, m, 0).getDate();
  const out = [], mon = y+'-'+String(m).padStart(2,'0');
  const last = (y===TODAY.getFullYear() && m===TODAY.getMonth()+1) ? TODAY.getDate() : days;
  const leaves = LEAVE.filter(l=>l.emp===empId && l.status==='approved' && l.from<=mon+'-31' && l.to>=mon+'-01');
  const fixes = PUNCH_FIX.filter(f=>f.emp===empId && f.status==='approved' && f.date.startsWith(mon));
  for(let d=1; d<=days; d++){
    const date = new Date(y,m-1,d), dow = date.getDay(), ds = mon+'-'+String(d).padStart(2,'0');
    if(d>last){ out.push({d, status:null}); continue; }
    const r = seed(empId+'-'+y+'-'+m+'-'+d);
    let status = 'present';
    if(dow===0 || (dow===6 && r<0.7)) status='off';
    else if(r>0.985) status='miss';
    else if(r>0.900 && r<=0.945) status='late';
    /* 請假只認已核准假單：當日請滿 8 小時才標為請假 */
    const lvH = status==='off' ? 0 : leaves.filter(l=>l.from<=ds&&l.to>=ds)
      .reduce((a,l)=>a+leaveHours(ds, l.from===ds?l.fromT:SHIFT.start, ds, l.to===ds?l.toT:SHIFT.end, empId),0);
    if(lvH>=WORK_DAY_H) status='leave';
    const shift = (status==='off'||status==='leave') ? null : shiftOf(empId, ds), st = SHIFT_TYPES[shift||'day'];
    const hm = mins => { mins=((mins%1440)+1440)%1440; return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'); };
    const inOff = status==='late' ? 8+Math.floor(r*40) : -(3+Math.floor(r*18));
    let tin = shift ? hm(toMin(st.start)+inOff) : null;
    let tout = (shift && status!=='miss') ? hm(toMin(st.end)+(r>0.6?10:30)+Math.floor(r*9)) : null;
    let fixed = false;
    fixes.filter(f=>f.date===ds).forEach(f=>{ if(f.kind==='in') tin=f.time; else tout=f.time; fixed=true; });
    if(status==='miss' && tin && tout) status='present';
    out.push({ d, dow, status, shift, in:tin, out:tout, lvH, fixed,
      ot: (status!=='off' && status!=='leave' && r>0.78) ? Math.round(r*20)/10 : 0 });
  }
  return out;
}
function attSummary(empId, y, m){
  const rows = attendance(empId,y,m).filter(r=>r.status);
  const c = {present:0,late:0,leave:0,miss:0,off:0, ot:0};
  rows.forEach(r=>{ c[r.status]++; c.ot += r.ot||0; });
  const work = c.present+c.late+c.miss;
  c.rate = work+c.leave ? Math.round(100*(work)/(work+c.leave)) : 100;
  c.punctual = work ? Math.round(100*(c.present)/work) : 100;
  return c;
}
</script>

function visibleEvents(){
  const units = activeUnitIds();
  return EVENTS.filter(e=>e.scope==='ALL' || units.includes(e.scope));
}
function viewCalendar(){
  const [y,m] = state.calMonth.split('-').map(Number);
  const first = new Date(y,m-1,1), start = first.getDay(), days = new Date(y,m,0).getDate();
  const prevDays = new Date(y,m-1,0).getDate();
  const evs = visibleEvents();
  const dowZh=['日','一','二','三','四','五','六'], dowEn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';
  for(let i=0;i<42;i++){
    const n=i-start+1;
    const out = n<1 || n>days;
    const dd = out ? (n<1?prevDays+n:n-days) : n;
    const dstr = out ? '' : `${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
    const dayEv = out?[]:evs.filter(e=>e.d===dstr);
    const isToday = dstr===ymd(TODAY);
    cells += `<button class="calday ${out?'out':''}" ${out?'disabled':''} data-day="${dstr}" aria-pressed="${dstr&&dstr===state.calDay}">
      <span class="d ${isToday?'today':''}">${dd}</span>
      ${dayEv.slice(0,3).map(e=>`<span class="ev ${e.type}">${esc(state.lang==='zh'?e.zh:e.en)}</span>`).join('')}
      ${dayEv.length>3?`<span class="ev" style="border-color:var(--line-strong);color:var(--ink-3)">+${dayEv.length-3}</span>`:''}
    </button>`;
  }
  const dayList = state.calDay ? evs.filter(e=>e.d===state.calDay) : [];
  return `
  <div class="split" style="grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)">
    <section class="card">
      <div class="calhead">
        <button class="btn ghost mini" data-mon="-1">←</button>
        <h2 class="mono">${state.calMonth}</h2>
        <span class="muted" style="font-size:12px">${esc(both('公司行事曆','Company calendar'))}</span>
        <button class="btn ghost mini" data-mon="1">→</button>
        <div class="spacer"></div>
        <span class="chip">${evs.length} ${esc(both('筆行程','events in scope'))}</span>
      </div>
      <div class="calgrid">
        ${dowZh.map((z,i)=>`<div class="caldow">${esc(state.lang==='zh'?z:dowEn[i])}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        ${Object.entries(EV_TYPE).map(([k,v])=>`<span><i class="ev ${k}" style="border:0"></i>${esc(both(v.zh,v.en))}</span>`).join('')}
      </div>
    </section>
    <section class="card">
      <div class="card-h"><h2>${state.calDay?`<span class="mono">${state.calDay}</span>`:esc(both('選取日期','Selected day'))}</h2>
        <span class="en">${esc(both('點選左方日期','Click a date'))}</span></div>
      ${dayList.length ? dayList.map(e=>`
        <div class="card-b" style="border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px">
          <div>${bi(e.zh,e.en)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span class="chip ${e.type==='audit'?'crit':e.type==='train'?'info':e.type==='hr'?'acc':'warn'}">${esc(both(EV_TYPE[e.type].zh,EV_TYPE[e.type].en))}</span>
            ${scopeChip(e.scope)}
          </div>
        </div>`).join('')
        : `<div class="empty">${esc(state.calDay?both('本日無行程','No events on this day'):both('尚未選取日期','No date selected'))}</div>`}
      <div class="legend">${esc(both('原型說明：行事曆為唯讀示意，未串接 Google 日曆或排班系統。',
        'Prototype note: the calendar is read-only — not connected to Google Calendar or the rostering system.'))}</div>
    </section>
  </div>`;
}
BINDERS['ann:cal']=function(){
  document.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{
    let [y,m]=state.calMonth.split('-').map(Number); m+=Number(b.dataset.mon);
    if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    state.calMonth=y+'-'+String(m).padStart(2,'0'); state.calDay=null; render();
  });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.day) return; state.calDay = state.calDay===b.dataset.day?null:b.dataset.day; render();
  });
};

/* 投保薪資級距（示意，實際以勞保局／健保署公告為準） */
const LABOR_GRADES = [29500,30300,31800,33300,34800,36300,38200,40100,42000,43900,45800];

};
const SURN='陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴徐', GIVEN=['怡君','雅婷','志明','淑芬','家豪','佩珊','俊傑','美玲','冠宇','欣怡','建宏','宜蓁','承翰','思妤','宗翰','筱涵','文雄','惠如','柏宇','詩涵'];
const addYears = (d,n) => { const x=new Date(d); x.setFullYear(x.getFullYear()+n); return ymd(x); };
const daysUntil = d => Math.round((new Date(d)-TODAY)/86400000);
const mask = (s, keep=4) => s ? '•'.repeat(Math.max(0,s.length-keep))+s.slice(-keep) : '—';

function empRecord(id){
  state.empRecords = state.empRecords || {};
  if(state.empRecords[id]) return state.empRecords[id];
  const p=person(id), r=k=>seed(id+'-'+k), n=+id.slice(1);
  const hiredY=+p.hired.slice(0,4), start=Math.round(p.salary*0.86/100)*100;
  const hist=[{date:p.hired, kind:'hire', title:p.title, unit:p.unit, band:p.band, salary:start, note:''}];
  if(TODAY.getFullYear()-hiredY>=3) hist.push({date:addYears(p.hired,2), kind:'raise', title:p.title, unit:p.unit, band:p.band, salary:Math.round(p.salary*0.93/100)*100, note:'年度調薪'});
  hist.push({date:'2026-01-01', kind:'raise', title:p.title, unit:p.unit, band:p.band, salary:p.salary, note:'2026 年度調薪'});
  const dep=Math.floor(r('dep')*3), lg=gradeFor(start,LABOR_GRADES), hg=gradeFor(start,HEALTH_GRADES);
  const ins=[{date:p.hired, kind:'join', labor:lg, health:hg, note:'到職加保'}];
  if(p.salary!==start) ins.push({date:'2026-01-01', kind:'adjust', labor:gradeFor(p.salary,LABOR_GRADES), health:gradeFor(p.salary,HEALTH_GRADES), note:'隨調薪調整'});
  const lic=(LICENSES[p.title]||[]).map((l,i)=>{
    let issued=p.hired, exp='';
    if(l.renew){ const x=new Date(TODAY); x.setMonth(x.getMonth()+4+Math.floor(r('m'+i)*(l.renew*12-4))); exp=ymd(x); issued=addYears(exp,-l.renew); }
    return {name:l.zh, no:(l.renew?'長照':'證')+'字第'+String(100000+Math.floor(r('no'+i)*899999))+'號', issued, exp,
      ce: l.ce ? {need:l.ce, have:Math.round(l.ce*(0.35+r('ce'+i)*0.7))} : null};
  });
  if(n%4===3 && lic.length) lic[lic.length-1].exp = ymd(new Date(TODAY.getTime()+ (40+Math.floor(r('soon')*40))*86400000));
  const contracts=[{kind:p.type==='part'?'部分工時勞動契約':'不定期勞動契約', start:p.hired, end:p.type==='part'?addYears('2026-'+p.hired.slice(5),1):'', note:''}];
  const renewals = p.type==='part' ? Array.from({length:TODAY.getFullYear()-hiredY},(_,i)=>({date:(hiredY+i+1)+p.hired.slice(4), note:'年度續約'})) : [];
  const perf=[]; for(let y=hiredY+1; y<=2025; y++){ const s=Math.round(72+r('pf'+y)*24);
    perf.push({year:y, period:y+' 年度', score:s, grade:s>=90?'A':s>=80?'B':s>=70?'C':'D', reviewer:p.mgr||'', note:''}); }
  const docs=[
    {name:'身分證影本.pdf', cat:'id', date:p.hired},
    {name:'勞動契約_'+p.hired.slice(0,4)+'.pdf', cat:'contract', date:p.hired},
    {name:'勞保加保申報表.pdf', cat:'ins', date:p.hired},
    {name:'警察刑事紀錄證明.pdf', cat:'record', date:p.hired},
    {name:'新進員工體檢報告.pdf', cat:'health', date:p.hired}
  ].concat(lic.map(l=>({name:l.name+'.pdf', cat:'license', date:l.issued})));
  return state.empRecords[id] = {
    basic:{ name:SURN[Math.floor(r('s')*SURN.length)]+GIVEN[Math.floor(r('g')*GIVEN.length)], idNo:'J2'+String(20000000+Math.floor(r('id')*79999999)),
      birth:(1968+Math.floor(r('b')*32))+'-'+String(1+Math.floor(r('bm')*12)).padStart(2,'0')+'-'+String(1+Math.floor(r('bd')*28)).padStart(2,'0'),
      mobile:p.mobile, phone:'03-5'+String(100000+Math.floor(r('ph')*899999)), email:id.toLowerCase()+'@kanghe-care.example',
      address:'新竹縣'+['竹北市光明六路','竹東鎮東林路','竹北市縣政九路','竹東鎮長春路'][n%4]+(10+n%190)+'號',
      emerName:SURN[Math.floor(r('es')*SURN.length)]+GIVEN[Math.floor(r('eg')*GIVEN.length)], emerRel:['配偶','父親','母親','子女','手足'][n%5],
      emerPhone:'09'+String(10000000+Math.floor(r('ep')*89999999)),
      bank:['台灣銀行','第一銀行','合作金庫','玉山銀行','國泰世華'][n%5], branch:['竹北分行','竹東分行','新竹分行'][n%3],
      acct:String(100000000000+Math.floor(r('ac')*899999999999)) },
    hist, ins, dep, pension:6, selfPension:n%3===0?6:0, lic, contracts, renewals, perf, docs
  };
}
function recFlags(id){
  const rec=empRecord(id);
  const soon=rec.lic.filter(l=>l.exp && daysUntil(l.exp)<=90);
  const ce=rec.lic.filter(l=>l.ce && l.ce.have<l.ce.need && l.exp && daysUntil(l.exp)<=365);
  return {soon, ce, expired:soon.filter(l=>daysUntil(l.exp)<0)};
}

function licChip(l){
  if(!l.exp) return `<span class="chip">${esc(both('永久有效','No expiry'))}</span>`;
  const d=daysUntil(l.exp);
  if(d<0) return `<span class="chip crit">${esc(both('已過期','Expired'))}</span>`;
  if(d<=90) return `<span class="chip warn">${esc(both(d+' 天後到期','Expires in '+d+'d'))}</span>`;
  return `<span class="chip ok">${esc(both('有效','Valid'))}</span>`;
}

function saveRec(id, kind, fd){
  const rec=empRecord(id), f=k=>(fd.get(k)||'').toString().trim(), file=()=>{ const x=fd.get('file'); return x&&x.name?x.name:''; };
  const addDoc=(name,cat)=>{ if(name) rec.docs.push({name, cat, date:ymd(TODAY)}); };
  if(kind==='basic'){ Object.keys(rec.basic).forEach(k=>{ if(fd.has(k)) rec.basic[k]=f(k); }); }
  if(kind==='hist') rec.hist.push({date:f('date'), kind:f('kind'), title:f('title'), unit:f('unit'), band:f('band'), salary:+f('salary')||0, note:f('note')});
  if(kind==='ins'){ rec.ins.push({date:f('date'), kind:f('kind'), labor:+f('labor'), health:+f('health'), note:f('note')}); rec.dep=+f('dep')||0; addDoc(file(),'ins'); rec.ins.sort((a,b)=>a.date.localeCompare(b.date)); }
  if(kind==='lic') rec.lic.push({name:f('name'), no:f('no'), issued:f('issued'), exp:f('exp'), ce:+f('ceNeed')?{need:+f('ceNeed'),have:+f('ceHave')||0}:null});
  if(kind==='contract'){ if(f('kind')==='續約') rec.renewals.push({date:f('start'), note:f('note')||'續約'+(f('end')?'至 '+f('end'):'')});
    else rec.contracts.push({kind:f('kind'), start:f('start'), end:f('end'), note:f('note')}); }
  if(kind==='perf'){ rec.perf.push({year:TODAY.getFullYear(), period:f('period'), score:+f('score'), grade:f('grade'), reviewer:me().id, note:f('note')}); addDoc(file(),'perf'); }
  if(kind==='doc') addDoc(file(), f('cat'));
}

          <div class="tile"><span class="k">${esc(both('準時率','Punctuality'))}</span><span class="v">${sum.punctual}%</span></div>
          <div class="tile"><span class="k">${esc(both('加班','Overtime'))}</span><span class="v">${sum.ot.toFixed(1)}</span><span class="d">${esc(both('小時','hours'))}</span></div>

        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">

          <span class="chip info">${esc(both('請假','Leave'))} ${sum.leave}</span>

        </div>
        <div class="attgrid" style="margin-top:10px">
          ${attendance(p.id,y,m).map(r=>`<span class="attcell ${r.status==='present'?'':(r.status||'off')}" title="${state.attMonth}-${String(r.d).padStart(2,'0')} ${r.status?L(ATT_STATUS[r.status]):''}"></span>`).join('')}
        </div>
      </section>
      <section>
        <div class="eyebrow" style="margin-bottom:8px">${esc(both('請假紀錄','Leave records'))}</div>
        ${leaves.length?leaves.map(l=>`<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px">
            <span class="chip">${esc(both(LEAVE_TYPES[l.type].zh,LEAVE_TYPES[l.type].en))}</span>
            <span class="mono">${l.from} ${l.fromT} → ${l.to!==l.from?l.to+' ':''}${l.toT}</span>
            <span class="mono muted">${fmtH(l.hours)}h</span>
            <span class="spacer" style="flex:1"></span>${statusChip(l.status)}</div>`).join('')
          :`<div class="muted" style="font-size:12.5px">${esc(both('無紀錄','No records'))}</div>`}
      </section>`:''}`;
  } else {
    body={basic:secBasic, hist:secHist, ins:secIns, qual:secQual, perf:secPerf}[sec](p, rec);
  }
  document.getElementById('overlay').innerHTML=`
    <div class="scrim" data-close></div>
    <aside class="drawer wide" role="dialog" aria-modal="true">
      <div class="drawer-h">
        <span class="avatar" style="width:40px;height:40px;font-size:15px">${esc((visible?rec.basic.name:p.zh).slice(0,1))}</span>
        <div>
          <h2 style="font-size:16px">${esc(visible?rec.basic.name:nameOf(p))} <span class="muted mono" style="font-size:12px">${p.id}</span></h2>
          <div class="muted" style="font-size:12px">${esc(both(TITLES[p.title].zh,TITLES[p.title].en))} · ${esc(both(unit(p.unit).zh,unit(p.unit).en))}</div>
        </div>
        <button class="x" data-close aria-label="${esc(both('關閉','Close'))}">✕</button>
      </div>
      ${visible?`<div class="subnav" style="padding:10px 14px 0">${REC_SECS.map(s=>`<button data-sec="${s.id}" aria-pressed="${s.id===sec}">${esc(state.lang==='zh'?s.zh:s.en)}</button>`).join('')}</div>`:''}
      <div class="drawer-b">${body}</div>
    </aside>`;
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeOverlay);
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ state.empSec=b.dataset.sec; state.empEdit=null; openPerson(id); });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ state.empEdit=b.dataset.edit; openPerson(id); });
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{ state.empEdit=null; openPerson(id); });
  document.querySelectorAll('form[data-save],form[data-add]').forEach(f=>f.onsubmit=e=>{
    e.preventDefault();
    saveRec(id, f.dataset.save||f.dataset.add, new FormData(f));
    state.empEdit=null; toast(both('已儲存（僅存於本次瀏覽）','Saved (this browser session only)'));
    openPerson(id);
  });
}

<script>
/* =============================== 我的工時 My Hours (Employee Time Logging) =============================== */
const MY_TABS = [
  {id:'clock',   zh:'上下班打卡', en:'Clock in/out'},
  {id:'fix',     zh:'補打卡',     en:'Missed punch'},
  {id:'leave',   zh:'請假申請',   en:'Leave request'},
  {id:'ot',      zh:'加班申請',   en:'Overtime'},
  {id:'anomaly', zh:'出勤異常',   en:'Exceptions'},
  {id:'balance', zh:'假別餘額',   en:'Leave balance'},
  {id:'log',     zh:'工作日誌',   en:'Work log'}
];
const HALF_SLOTS = (()=>{ const o=[]; for(let m=toMin(SHIFT.start); m<=toMin(SHIFT.end); m+=30) o.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')); return o; })();
const slotOpts = sel => HALF_SLOTS.map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('');
const nowHM = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const myPunches = () => (state.punches||[]).filter(p=>p.emp===me().id);

/* 工時：扣除午休 1 小時（若跨越午休） */
function workedHours(inT, outT, shift='day'){
  if(!inT||!outT) return 0;
  let m=toMin(outT)-toMin(inT); if(m<0) m+=1440;   // 下班早於上班 = 跨午夜
  if(SHIFT_TYPES[shift].lunch && toMin(inT)<=toMin(SHIFT.lunchS) && toMin(outT)>=toMin(SHIFT.lunchE)) m-=60;
  return Math.max(0, Math.round(m/6)/10);
}
/* 本月每日打卡紀錄：系統資料 + 本次打卡 + 已核准補打卡 */
function myMonthRows(){
  const u=me(), y=TODAY.getFullYear(), m=TODAY.getMonth()+1, mon=ymd(TODAY).slice(0,7);
  return attendance(u.id,y,m).filter(r=>r.status).map(r=>{
    const date=mon+'-'+String(r.d).padStart(2,'0');
    let inT=r.in, outT=r.out, src='sys';
    if(date===ymd(TODAY)){ inT=null; outT=null; src='live'; }
    myPunches().filter(p=>p.date===date).forEach(p=>{ if(p.kind==='in'&&!inT) inT=p.time; if(p.kind==='out') outT=p.time; });
    PUNCH_FIX.filter(f=>f.emp===u.id&&f.date===date&&f.status==='approved').forEach(f=>{ if(f.kind==='in') inT=f.time; else outT=f.time; src='fix'; });
    const leaveH=LEAVE.filter(l=>l.emp===u.id&&l.status==='approved'&&l.from<=date&&l.to>=date)
      .reduce((a,l)=>a+leaveHours(date, l.from===date?l.fromT:SHIFT.start, date, l.to===date?l.toT:SHIFT.end, u.id),0);
    const issues=[];
    if(r.status!=='off' && r.status!=='leave' && date<=ymd(TODAY)){
      if(!inT && date<ymd(TODAY) && leaveH<WORK_DAY_H) issues.push('noin');
      const st=SHIFT_TYPES[r.shift||'day'];
      if(inT && minDiff(inT,st.start)>0 && leaveH===0) issues.push('late');
      if(inT && !outT && date<ymd(TODAY)) issues.push('noout');
      if(outT && minDiff(outT,st.end)<0 && leaveH===0) issues.push('early');
    }
    return {date, dow:r.dow, status:r.status, shift:r.shift, inT, outT, hours:workedHours(inT,outT,r.shift||'day'), leaveH, src, issues};
  });
}
const ISSUE = {
  late:{zh:'遲到',en:'Late',cls:'warn'}, early:{zh:'早退',en:'Left early',cls:'warn'},
  noin:{zh:'未打上班卡',en:'No clock-in',cls:'crit'}, noout:{zh:'未打下班卡',en:'No clock-out',cls:'crit'}
};
const DOW = ['日','一','二','三','四','五','六'];

function viewMyHours(){
  const u=me(), mon=ymd(TODAY).slice(0,7);
  const tab=state.myTab||'clock';
  const rows=myMonthRows();
  const workedH=rows.reduce((a,r)=>a+r.hours,0);
  const leaveH=LEAVE.filter(l=>l.emp===u.id&&l.status!=='rejected'&&l.from.startsWith(mon)).reduce((a,l)=>a+l.hours,0);
  const otH=OT_REQ.filter(o=>o.emp===u.id&&o.status!=='rejected'&&o.date.startsWith(mon)).reduce((a,o)=>a+o.hours,0);
  const pend=[...LEAVE,...OT_REQ,...PUNCH_FIX].filter(x=>x.emp===u.id&&(x.status==='pending'||x.status==='countersign')).length;
  const body={clock:myClock, fix:myFix, leave:myLeave, ot:myOT, anomaly:myAnomaly, balance:myBalance, log:myWorkLog}[tab](rows);
  return `
  <div class="grid">
    <div class="tiles">
      <div class="tile"><span class="k">${esc(both('本月出勤工時','Hours worked this month'))}</span><span class="v">${fmtH(workedH)}</span><span class="d">${esc(both('小時','hours'))}</span></div>
      <div class="tile"><span class="k">${esc(both('本月請假','Leave this month'))}</span><span class="v">${fmtH(leaveH)}</span><span class="d">${esc(both('小時（折合 '+hToDays(leaveH)+' 天）','hours ('+hToDays(leaveH)+' days)'))}</span></div>
      <div class="tile"><span class="k">${esc(both('本月加班','Overtime this month'))}</span><span class="v">${fmtH(otH)}</span>
        <span class="d">${esc(both('上限 '+OT_MONTH_CAP_H+' 小時','cap '+OT_MONTH_CAP_H+' h'))}</span>
        <div class="bar" style="margin-top:6px"><i class="${otH>OT_MONTH_CAP_H*0.8?'warn':''}" style="width:${Math.min(100,otH/OT_MONTH_CAP_H*100)}%"></i></div></div>
      <div class="tile"><span class="k">${esc(both('審核中申請','Requests in review'))}</span><span class="v">${pend}</span><span class="d">${esc(both('件','requests'))}</span></div>
    </div>
    <div class="subnav" role="tablist">${MY_TABS.map(t=>`<button data-mytab="${t.id}" aria-pressed="${t.id===tab}">${esc(state.lang==='zh'?t.zh:t.en)}</button>`).join('')}</div>
    ${body}
    ${myRequests()}
    <div class="note">${esc(both(
      '工時制度假設：日班 08:00–17:00、午休 12:00–13:00，1 天 = 8 小時；請假最小單位 '+LEAVE_UNIT_H+' 小時（可請半天 4 小時或以小時計）。輪班制（小夜、大夜）與 104 系統串接方式為待確認事項。',
      'Assumptions: day shift 08:00–17:00 with a 12:00–13:00 lunch, 1 day = 8 hours; minimum leave unit '+LEAVE_UNIT_H+' h (half day = 4 h, or by the hour). Rotating shifts and the 104 integration method are still to be confirmed.'))}</div>
  </div>`;
}

function myClock(rows){
  const today=ymd(TODAY), tp=myPunches().filter(p=>p.date===today);
  const lastIn=tp.filter(p=>p.kind==='in')[0], lastOut=tp.filter(p=>p.kind==='out').slice(-1)[0];
  return `
  <section class="card">
    <div class="card-h"><h2>${esc(both('上下班打卡','Clock in / out'))}</h2><span class="en mono">${today}</span></div>
    <div class="card-b clockface">
      <span class="now" id="nowClock">${nowHM()}</span>
      <button class="btn" data-punch="in" ${lastIn?'disabled':''}>${esc(both('上班打卡','Clock in'))}</button>
      <button class="btn ghost" data-punch="out" ${lastIn?'':'disabled'}>${esc(both('下班打卡','Clock out'))}</button>
      <span class="muted" style="font-size:12.5px">
        ${esc(both('今日','Today'))}：${esc(both('上班','in'))} <b class="mono">${lastIn?lastIn.time:'—'}</b> ·
        ${esc(both('下班','out'))} <b class="mono">${lastOut?lastOut.time:'—'}</b>
        ${lastIn&&lastOut?` · ${esc(both('工時','worked'))} <b class="mono">${fmtH(workedHours(lastIn.time,lastOut.time))}</b> h`:''}
      </span>
    </div>
  </section>
  <section class="card">
    <div class="card-h"><h2>${esc(both('本月打卡紀錄','Punch records this month'))}</h2></div>
    <div class="tablewrap"><table>
      <thead><tr><th>${bi('日期','Date')}</th><th>${bi('班別','Shift')}</th><th>${bi('上班','In')}</th><th>${bi('下班','Out')}</th><th>${bi('工時','Hours')}</th><th>${bi('請假時數','Leave h')}</th><th>${bi('狀態','Status')}</th></tr></thead>
      <tbody>${rows.slice().reverse().map(r=>`<tr>
        <td class="mono">${r.date} <span class="muted">(${DOW[r.dow]})</span></td>
        <td>${r.shift?`<span class="chip ${SHIFT_TYPES[r.shift].cls}">${esc(both(SHIFT_TYPES[r.shift].zh,SHIFT_TYPES[r.shift].en))}</span>`:'—'}</td>
        <td class="mono">${r.inT||'—'}</td><td class="mono">${r.outT||'—'}</td>
        <td class="num">${r.hours?fmtH(r.hours):'—'}</td>
        <td class="num">${r.leaveH?fmtH(r.leaveH):'—'}</td>
        <td>${r.status==='off'?`<span class="chip">${esc(both('排休','Rest day'))}</span>`
             : r.issues.length? r.issues.map(i=>`<span class="chip ${ISSUE[i].cls}">${esc(both(ISSUE[i].zh,ISSUE[i].en))}</span>`).join(' ')
             : r.src==='fix'?`<span class="chip info">${esc(both('已補打卡','Corrected'))}</span>`
             : `<span class="chip ok">${esc(both('正常','OK'))}</span>`}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </section>`;
}

function myFix(){
  const pre=state.fixPrefill||{};
  return `
  <section class="card">
    <div class="card-h"><h2>${esc(both('補打卡申請','Missed-punch correction'))}</h2>
      <span class="en">${esc(both('忘記打卡或打卡機故障時提出，需主管核准','For missed or failed punches; needs director approval'))}</span></div>
    <form id="fixForm" class="card-b frm">
      <div class="row">
        <div><label>${esc(both('日期','Date'))}</label><input type="date" name="date" value="${pre.date||ymd(TODAY)}" max="${ymd(TODAY)}" required></div>
        <div><label>${esc(both('補登類別','Punch'))}</label><select name="kind">
          ${Object.entries(PUNCH_KIND).map(([k,v])=>`<option value="${k}" ${pre.kind===k?'selected':''}>${esc(both(v.zh,v.en))}</option>`).join('')}</select></div>
        <div><label>${esc(both('實際時間','Actual time'))}</label><input type="time" name="time" value="${pre.time||(pre.kind==='out'?SHIFT.end:SHIFT.start)}" required></div>
      </div>
      <div><label>${esc(both('原因','Reason'))}</label><textarea name="reason" required placeholder="${esc(both('例如：忘記打卡、打卡機故障、外出公務','e.g. forgot, clock malfunction, off-site duty'))}"></textarea></div>
      <div><button type="submit" class="btn">${esc(both('送出補打卡','Submit correction'))}</button></div>
    </form>
  </section>`;
}

function myLeave(){
  const bal=leaveBalance(me().id);
  const d=state.leaveDraft||{type:'annual',from:ymd(TODAY),fromT:SHIFT.start,to:ymd(TODAY),toT:SHIFT.end};
  return `
  <section class="card">
    <div class="card-h"><h2>${esc(both('請假申請','Leave request'))}</h2>
      <span class="en">${esc(both('以小時計算，可請半天或數小時','Counted in hours — half days and partial days allowed'))}</span></div>
    <form id="leaveForm" class="card-b frm">
      <div class="row">
        <div><label>${esc(both('假別','Leave type'))}</label><select name="type">
          ${bal.map(b=>`<option value="${b.k}" ${d.type===b.k?'selected':''}>${esc(both(b.t.zh,b.t.en))}${b.left!=null?esc(both('（剩 '+fmtH(b.left)+' 小時）',' ('+fmtH(b.left)+' h left)')):''}</option>`).join('')}</select></div>
        <div><label>${esc(both('快速選擇','Quick pick'))}</label>
          <div class="seg">
            <button type="button" data-quick="full">${esc(both('全天 8h','Full day'))}</button>
            <button type="button" data-quick="am">${esc(both('上午 4h','AM'))}</button>
            <button type="button" data-quick="pm">${esc(both('下午 4h','PM'))}</button>
          </div></div>
      </div>
      <div class="row">
        <div><label>${esc(both('開始日期','Start date'))}</label><input type="date" name="from" value="${d.from}" required></div>
        <div><label>${esc(both('開始時間','Start time'))}</label><select name="fromT">${slotOpts(d.fromT)}</select></div>
        <div><label>${esc(both('結束日期','End date'))}</label><input type="date" name="to" value="${d.to}" required></div>
        <div><label>${esc(both('結束時間','End time'))}</label><select name="toT">${slotOpts(d.toT)}</select></div>
      </div>
      <div class="row">
        <div><label>${esc(both('請假時數','Leave hours'))}</label><div class="calc" id="leaveCalc"></div></div>
      </div>
      <div><label>${esc(both('事由','Reason'))}</label><textarea name="reason" required></textarea></div>
      <div><button type="submit" class="btn">${esc(both('送出請假','Submit leave'))}</button></div>
    </form>
  </section>`;
}

function myOT(){
  const mon=ymd(TODAY).slice(0,7);
  const used=OT_REQ.filter(o=>o.emp===me().id&&o.status!=='rejected'&&o.date.startsWith(mon)).reduce((a,o)=>a+o.hours,0);
  return `
  <section class="card">
    <div class="card-h"><h2>${esc(both('加班申請','Overtime request'))}</h2>
      <span class="en">${esc(both('本月已申請 '+fmtH(used)+' / '+OT_MONTH_CAP_H+' 小時','This month '+fmtH(used)+' / '+OT_MONTH_CAP_H+' h'))}</span></div>
    <form id="otForm" class="card-b frm" data-used="${used}">
      <div class="row">
        <div><label>${esc(both('加班日期','Date'))}</label><input type="date" name="date" value="${ymd(TODAY)}" required></div>
        <div><label>${esc(both('開始時間','Start'))}</label><input type="time" name="start" value="${SHIFT.end}" step="1800" required></div>
        <div><label>${esc(both('結束時間','End'))}</label><input type="time" name="end" value="19:00" step="1800" required></div>
        <div><label>${esc(both('加班時數','Hours'))}</label><div class="calc" id="otCalc"></div></div>
      </div>
      <div class="row">
        <div><label>${esc(both('補償方式','Compensation'))}</label><select name="comp">
          ${Object.entries(OT_COMP).map(([k,v])=>`<option value="${k}">${esc(both(v.zh,v.en))}</option>`).join('')}</select></div>
      </div>
      <div><label>${esc(both('加班事由','Reason'))}</label><textarea name="reason" required></textarea></div>
      <div><button type="submit" class="btn">${esc(both('送出加班申請','Submit overtime'))}</button></div>
    </form>
    <div class="legend">${esc(both('依勞基法第 32 條，每月延長工時上限 46 小時（經勞資會議同意可調整為三個月 138 小時）。',
      'Labor Standards Act §32: overtime is capped at 46 h/month (or 138 h per 3 months with a labor-management agreement).'))}</div>
  </section>`;
}

function myAnomaly(rows){
  const bad=rows.filter(r=>r.issues.length);
  const fixed=d=>PUNCH_FIX.find(f=>f.emp===me().id&&f.date===d&&f.status!=='rejected');
  return `
  <section class="card">
    <div class="card-h"><h2>${esc(both('出勤異常紀錄','Attendance exceptions'))}</h2>
      <span class="en">${esc(both('本月 '+bad.length+' 筆','This month: '+bad.length))}</span></div>
    ${bad.length?`<div class="tablewrap"><table>
      <thead><tr><th>${bi('日期','Date')}</th><th>${bi('異常','Exception')}</th><th>${bi('上班','In')}</th><th>${bi('下班','Out')}</th><th>${bi('處理','Action')}</th></tr></thead>
      <tbody>${bad.slice().reverse().map(r=>{ const f=fixed(r.date); return `<tr>
        <td class="mono">${r.date} <span class="muted">(${DOW[r.dow]})</span></td>
        <td>${r.issues.map(i=>`<span class="chip ${ISSUE[i].cls}">${esc(both(ISSUE[i].zh,ISSUE[i].en))}</span>`).join(' ')}</td>
        <td class="mono">${r.inT||'—'}</td><td class="mono">${r.outT||'—'}</td>
        <td>${f?statusChip(f.status)
          : r.issues.some(i=>i==='noin'||i==='noout')
            ? `<button class="btn mini" data-fixdate="${r.date}" data-fixkind="${r.issues.includes('noin')?'in':'out'}">${esc(both('申請補打卡','Request correction'))}</button>`
            : `<button class="btn ghost mini" data-leavefor="${r.date}" data-leaveissue="${r.issues[0]}" data-in="${r.inT||''}" data-out="${r.outT||''}">${esc(both('補請假','Cover with leave'))}</button>`}</td>
      </tr>`;}).join('')}</tbody></table></div>`
    :`<div class="empty">${esc(both('本月無出勤異常','No exceptions this month'))}</div>`}
  </section>`;
}

function myBalance(){
  const u=me(), bal=leaveBalance(u.id);
  return `
  <section class="card">
    <div class="card-h"><h2>${esc(both('假別與剩餘時數','Leave types & balances'))}</h2>
      <span class="en">${esc(both(TODAY.getFullYear()+' 年度 · 到職日 '+u.hired,TODAY.getFullYear()+' · hired '+u.hired))}</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>${bi('假別','Type')}</th><th>${bi('年度額度','Entitlement')}</th><th>${bi('已使用','Used')}</th><th>${bi('審核中','Pending')}</th><th>${bi('剩餘','Remaining')}</th><th>${bi('規定','Rule')}</th></tr></thead>
      <tbody>${bal.map(b=>`<tr>

BINDERS['hr:mylog']=function(){
  const u=me(), go=t=>{ state.myTab=t; render(); };
  document.querySelectorAll('[data-mytab]').forEach(b=>b.onclick=()=>{ state.fixPrefill=null; go(b.dataset.mytab); });

  document.querySelectorAll('[data-fixdate]').forEach(b=>b.onclick=()=>{

  });
  document.querySelectorAll('[data-leavefor]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.leavefor, late=b.dataset.leaveissue==='late';
    const snap=t=>HALF_SLOTS.find(s=>toMin(s)>=toMin(t))||SHIFT.end;
    state.leaveDraft = late
      ? {type:'personal', from:d, fromT:SHIFT.start, to:d, toT:snap(b.dataset.in)}
      : {type:'personal', from:d, fromT:HALF_SLOTS.filter(s=>toMin(s)<=toMin(b.dataset.out)).pop()||SHIFT.start, to:d, toT:SHIFT.end};
    go('leave');
  });

  const fix=document.getElementById('fixForm');
  if(fix) fix.onsubmit=e=>{
    e.preventDefault(); const fd=new FormData(fix);
    const r={id:nextId('PF',PUNCH_FIX), emp:u.id, date:fd.get('date'), kind:fd.get('kind'), time:fd.get('time'),
      filed:ymd(TODAY), status:'pending', note:{zh:fd.get('reason'),en:fd.get('reason')}};
    PUNCH_FIX.push(r); state.fixPrefill=null;
    toast(both(r.id+' 補打卡申請已送出，待主管核准', r.id+' correction submitted for approval')); render();
  };

  const lf=document.getElementById('leaveForm');
  if(lf){
    const calc=()=>{
      const fd=new FormData(lf), h=leaveHours(fd.get('from'),fd.get('fromT'),fd.get('to'),fd.get('toT'),u.id);
      const b=leaveBalance(u.id).find(x=>x.k===fd.get('type'));
      const over=b.left!=null && h>b.left, el=document.getElementById('leaveCalc');
      el.className='calc'+(h<=0||over?' bad':'');
      el.textContent = h<=0 ? both('請確認起訖時間','Check the start/end times')
        : both(fmtH(h)+' 小時（折合 '+hToDays(h)+' 天）', fmtH(h)+' h ('+hToDays(h)+' days)') + (over?both(' · 超過剩餘 '+fmtH(b.left)+' 小時',' · exceeds '+fmtH(b.left)+' h left'):'');
      return {h, over, b};
    };
    lf.oninput=calc; lf.onchange=calc; calc();
    lf.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{
      const q=b.dataset.quick;
      lf.to.value=lf.from.value;
      lf.fromT.value = q==='pm'?SHIFT.lunchE:SHIFT.start;
      lf.toT.value   = q==='am'?SHIFT.lunchS:SHIFT.end;
      calc();
    });
    lf.onsubmit=e=>{
      e.preventDefault(); const {h,over,b}=calc();
      if(h<=0){ toast(both('請假時數需大於 0','Leave hours must be greater than 0')); return; }
      if(over){ toast(both(b.t.zh+'剩餘時數不足','Not enough '+b.t.en+' balance')); return; }
      const fd=new FormData(lf);
      const r=mkLeave(nextId('L',LEAVE), u.id, fd.get('type'), fd.get('from'), fd.get('fromT'), fd.get('to'), fd.get('toT'),
        ymd(TODAY), 'pending', {zh:fd.get('reason'),en:fd.get('reason')});
      LEAVE.push(r); state.leaveDraft=null;
      toast(both(r.id+' 已送出 '+fmtH(r.hours)+' 小時請假', r.id+' submitted: '+fmtH(r.hours)+' h leave')); render();
    };
  }

  const of=document.getElementById('otForm');
  if(of){
    const used=+of.dataset.used;
    const calc=()=>{
      const h=spanHours(of.start.value, of.end.value), el=document.getElementById('otCalc');
      const over=used+h>OT_MONTH_CAP_H;
      el.className='calc'+(h<=0||over?' bad':'');
      el.textContent=both(fmtH(h)+' 小時', fmtH(h)+' h')+(over?both(' · 超過每月上限',' · over monthly cap'):'');
      return {h,over};
    };
    of.oninput=calc; calc();
    of.onsubmit=e=>{
      e.preventDefault(); const {h,over}=calc();
      if(h<=0){ toast(both('加班時數需大於 0','Overtime must be greater than 0')); return; }
      if(over){ toast(both('超過每月 '+OT_MONTH_CAP_H+' 小時加班上限','Exceeds the '+OT_MONTH_CAP_H+' h monthly cap')); return; }
      const fd=new FormData(of);
      const r={id:nextId('OT',OT_REQ), emp:u.id, date:fd.get('date'), start:fd.get('start'), end:fd.get('end'), hours:h,
        comp:fd.get('comp'), filed:ymd(TODAY), status:'pending', note:{zh:fd.get('reason'),en:fd.get('reason')}};
      OT_REQ.push(r);
      toast(both(r.id+' 加班申請已送出 '+fmtH(h)+' 小時', r.id+' overtime submitted: '+fmtH(h)+' h')); render();
    };
  }

  const wl=document.getElementById('logHours');
  if(wl) wl.onsubmit=e=>{
    e.preventDefault(); const fd=new FormData(wl);
    state.myHoursLog=state.myHoursLog||{entries:[]};
    state.myHoursLog.entries.push({empId:u.id, date:fd.get('date'), hours:fd.get('hours'), type:fd.get('type'),
      typeZh:WORK_TYPES[fd.get('type')].zh, notes:fd.get('notes')});
    render();
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ state.myHoursLog.entries.splice(+b.dataset.del,1); render(); });
};

<script>

      <div class="tile"><span class="k">${esc(both('加班時數','Overtime hours'))}</span><span class="v">${agg.ot.toFixed(0)}</span><span class="d">${esc(both('小時','hours'))}</span></div>

      <div class="tablewrap"><table>
        <thead><tr><th>${bi('據點','Facility')}</th><th>${bi('人數','Staff')}</th><th>${bi('出勤率','Attendance rate')}</th>
          <th>${bi('遲到','Late')}</th><th>${bi('未打卡','Missing')}</th></tr></thead>
        <tbody>${byUnit.map(r=>`<tr>
          <td>${esc(both(unit(r.u).zh,unit(r.u).en))}</td>
          <td class="num">${r.n}</td>
          <td><div style="display:flex;align-items:center;gap:8px"><span class="num" style="min-width:38px">${r.rate}%</span>
            <span class="bar"><i class="${r.rate<95?'low':''}" style="width:${Math.max(2,Math.min(100,(r.rate-85)/15*100))}%"></i></span></div></td>
          <td class="num">${r.late}</td><td class="num">${r.miss}</td></tr>`).join('')}

          <th>${bi('出勤率','Rate')}</th><th>${bi('正常','On time')}</th><th>${bi('遲到','Late')}</th>

/* =============================== 請假審核 Leave approvals =============================== */
const LEAVE_STATUS={
  pending:{zh:'待主管簽核',en:'Awaiting director',cls:'warn'},
  countersign:{zh:'待人資複核',en:'Awaiting HR countersign',cls:'info'},
  approved:{zh:'已核准',en:'Approved',cls:'ok'},
  rejected:{zh:'已駁回',en:'Rejected',cls:'crit'}
};
function statusChip(s){ const o=LEAVE_STATUS[s]; return `<span class="chip ${o.cls}">${esc(both(o.zh,o.en))}</span>`; }
function viewLeave(){
  const units=activeUnitIds();
  const order={pending:0,countersign:1,approved:2,rejected:3};
  const scoped=arr=>arr.filter(x=>units.includes(person(x.emp).unit))
    .sort((a,b)=>order[a.status]-order[b.status] || (a.from||a.date).localeCompare(b.from||b.date));
  const list=scoped(LEAVE), ots=scoped(OT_REQ), fixes=scoped(PUNCH_FIX);
  const all=[...list,...ots,...fixes];
  const pend=all.filter(l=>l.status==='pending').length, cs=all.filter(l=>l.status==='countersign').length;
  const rowAction=l=>{
    if((l.status==='pending'||l.status==='countersign') && l.emp===me().id)
      return `<span class="lock">${lockIcon()}${esc(both('本人申請，需由他人簽核','Own request — another approver signs'))}</span>`;
    if(l.status==='pending' && can('approve'))
      return `<button class="btn mini" data-act="approve" data-id="${l.id}">${esc(both('核准','Approve'))}</button>
              <button class="btn ghost mini" data-act="reject" data-id="${l.id}">${esc(both('駁回','Reject'))}</button>`;
    if(l.status==='countersign' && can('finalize'))
      return `<button class="btn mini" data-act="final" data-id="${l.id}">${esc(both('人資複核','Countersign'))}</button>`;
    if(l.status==='countersign' && !can('finalize'))
      return `<span class="lock">${lockIcon()}${esc(both('待人資處理','With HR'))}</span>`;
    if(l.status==='pending' && !can('approve'))
      return `<span class="lock">${lockIcon()}${esc(both('無簽核權限','No approval rights'))}</span>`;
    return `<span class="muted">—</span>`;
  };
  const who=p=>`<td>${esc(nameOf(p))} <span class="muted mono" style="font-size:11px">${p.id}</span></td><td>${esc(both(unit(p.unit).zh,unit(p.unit).en))}</td>`;
  const empty=`<div class="empty">${esc(both('目前資料範圍內沒有申請','No requests in the current data scope'))}</div>`;
  return `
  <div class="grid">
    <div class="tiles">
      <div class="tile"><span class="k">${esc(both('待主管簽核','Awaiting director'))}</span><span class="v">${pend}</span><span class="d">${esc(both('件','requests'))}</span></div>

BINDERS['hr:leave']=function(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const l=[...LEAVE,...OT_REQ,...PUNCH_FIX].find(x=>x.id===b.dataset.id); if(!l) return;
    const p=person(l.emp);
    if(b.dataset.act==='approve'){ l.status='countersign';
      toast(both(l.id+'：'+nameOf(p)+' 已核准，轉人資複核', l.id+': approved for '+nameOf(p)+', sent to HR for countersign')); }
    if(b.dataset.act==='reject'){ l.status='rejected';
      toast(both(l.id+'：已駁回', l.id+': rejected')); }
    if(b.dataset.act==='final'){ l.status='approved';
      toast(both(l.id+'：人資複核完成，申請生效', l.id+': countersigned by HR — now effective')); }
    render();
  });
};

const toCSV = rows => rows.map(r=>r.map(v=>{ const t=String(v??''); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; }).join(',')).join('\n');
const monthLeaveH = (empId, month) => LEAVE.filter(l=>l.emp===empId&&l.status==='approved'&&l.from.startsWith(month)).reduce((a,l)=>a+l.hours,0);
const monthOTH = (empId, month) => OT_REQ.filter(o=>o.emp===empId&&o.status==='approved'&&o.date.startsWith(month)).reduce((a,o)=>a+o.hours,0);
function generatePersonnelReport(month){
  const units=activeUnitIds();
  const list=STAFF.filter(s=>units.includes(s.unit)).sort((a,b)=>a.id.localeCompare(b.id));
  const myLog=state.myHoursLog||{entries:[]};
  const rows=[['員工編號','姓名','職稱','部門','據點','到職日','職等','薪資','Email','手機','緊急聯絡人','薪轉帳戶',
    '勞保投保薪資','健保投保金額','勞退自提%','契約類型','證照（到期日）','最近考核','工作日誌時數','工作類型統計','特休剩餘(時)','補休剩餘(時)']];
  list.forEach(e=>{
    const entries=myLog.entries.filter(x=>x.empId===e.id&&x.date.startsWith(month));
    const totalHours=entries.reduce((s,x)=>s+(parseFloat(x.hours)||0),0);
    const types={};
    entries.forEach(x=>{ types[x.type]=(types[x.type]||0)+(parseFloat(x.hours)||0); });
    const typeStr=Object.entries(types).map(([k,v])=>`${WORK_TYPES[k].zh}:${fmtH(v)}h`).join('; ') || '無';
    const bal=leaveBalance(e.id), left=k=>fmtH(bal.find(b=>b.k===k).left);
    const rec=empRecord(e.id), b=rec.basic, ins=rec.ins.filter(x=>x.kind!=='quit').slice(-1)[0], pf=rec.perf.slice(-1)[0];
    const fin=can('salary'), contact=can('mobile');
    rows.push([e.id, b.name, TITLES[e.title].zh, DEPTS[e.dept].zh, unit(e.unit).zh, e.hired,
      fin?e.band:'受限', fin?e.salary:'受限', b.email, contact?b.mobile:'受限', contact?`${b.emerName}(${b.emerRel}) ${b.emerPhone}`:'受限',
      fin?`${b.bank}${b.branch} ${b.acct}`:'受限', fin&&ins?ins.labor:'受限', fin&&ins?ins.health:'受限', rec.selfPension,
      rec.contracts.slice(-1)[0].kind, rec.lic.map(l=>`${l.name}(${l.exp||'永久'})`).join('; ')||'無',
      pf?`${pf.period} ${PERF_GRADE[pf.grade].zh}(${pf.score})`:'無',
      fmtH(totalHours), typeStr, left('annual'), left('comp')]);
  });
  return toCSV(rows);
}
function generateAttendanceReport(month){
  const units=activeUnitIds();
  const list=STAFF.filter(s=>units.includes(s.unit)).sort((a,b)=>a.id.localeCompare(b.id));
  const [y,m]=month.split('-').map(Number);
  const rows=[['員工編號','職稱','據點','部門','出勤率%','正常','遲到','請假(天)','未打卡','請假時數','加班時數(核准)','補打卡次數','工作日誌時數']];
  list.forEach(e=>{
    const sum=attSummary(e.id,y,m);
    const logged=(state.myHoursLog||{entries:[]}).entries.filter(x=>x.empId===e.id&&x.date.startsWith(month));
    const loggedHours=logged.reduce((s,x)=>s+(parseFloat(x.hours)||0),0);
    const fixes=PUNCH_FIX.filter(f=>f.emp===e.id&&f.status==='approved'&&f.date.startsWith(month)).length;
    rows.push([e.id, TITLES[e.title].zh, unit(e.unit).zh, DEPTS[e.dept].zh, sum.rate, sum.present, sum.late, sum.leave, sum.miss,
      fmtH(monthLeaveH(e.id,month)), fmtH(monthOTH(e.id,month)), fixes, fmtH(loggedHours)]);
  });
  return toCSV(rows);
}
function generateLeaveReport(month){
  const units=activeUnitIds();
  const inScope=x=>units.includes(person(x.emp).unit);
  const rows=[['單號','類型','員工編號','職稱','項目','開始','結束','時數','折合天數','狀態','申請日','備註']];
  LEAVE.filter(l=>inScope(l)&&l.from.startsWith(month)).sort((a,b)=>a.from.localeCompare(b.from)).forEach(l=>{
    rows.push([l.id,'請假',l.emp,person(l.emp).zh,LEAVE_TYPES[l.type].zh,`${l.from} ${l.fromT}`,`${l.to} ${l.toT}`,fmtH(l.hours),hToDays(l.hours),LEAVE_STATUS[l.status].zh,l.filed,l.note?l.note.zh:'']);
  });
  OT_REQ.filter(o=>inScope(o)&&o.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>{
    rows.push([o.id,'加班',o.emp,person(o.emp).zh,OT_COMP[o.comp].zh,`${o.date} ${o.start}`,`${o.date} ${o.end}`,fmtH(o.hours),'',LEAVE_STATUS[o.status].zh,o.filed,o.note?o.note.zh:'']);
  });
  PUNCH_FIX.filter(f=>inScope(f)&&f.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(f=>{
    rows.push([f.id,'補打卡',f.emp,person(f.emp).zh,PUNCH_KIND[f.kind].zh,`${f.date} ${f.time}`,'','','',LEAVE_STATUS[f.status].zh,f.filed,f.note?f.note.zh:'']);
  });
  return toCSV(rows);
}
function generateFinancialReport(month){
  if(!can('salary')) return '';
  const units=activeUnitIds();
  const list=STAFF.filter(s=>units.includes(s.unit)).sort((a,b)=>a.id.localeCompare(b.id));
  const rows=[['員工編號','姓名','據點','部門','計薪方式','應發金額','實發金額','雇主勞保','雇主健保','雇主勞退','人事成本合計']];
  list.forEach(e=>{
    const r=calcPay(e.id, month);
    rows.push([e.id, empName(e.id), unit(e.unit).zh, DEPTS[e.dept].zh, e.type==='part'?'時薪':'月薪', r.gross, r.net, r.er.labor, r.er.health, r.er.pension, r.gross+r.er.total]);
  });
  return toCSV(rows);
}
function downloadCSV(data, filename){
  const bom='﻿';
  const csv=new Blob([bom+data], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(csv);
  const link=document.createElement('a');
  link.href=url;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
