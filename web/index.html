<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>誠馨入口 登入</title>
<link rel="stylesheet" href="/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<header><h1>誠馨日照營運入口</h1><nav id="nav" class="hidden"></nav></header>
<main>
  <section id="loginBox" class="card hidden">
    <h2>登入</h2>
    <p class="muted">請用公司的 Google 帳號登入。登入後的權限由公司在系統內設定。</p>
    <div id="gbtn" aria-label="用 Google 登入"></div>
    <p id="noGoogle" class="muted hidden">尚未設定 Google 登入（開發環境）。</p>
    <form id="devForm" class="hidden mt12">
      <p class="muted">開發用假登入（正式環境不會出現）</p>
      <label for="devEmail">Email</label><input id="devEmail" type="email" required placeholder="manager@example.test">
      <button type="submit" class="mt8">假登入</button>
    </form>
    <div id="loginMsg" class="msg bad hidden" role="alert"></div>
  </section>
  <section id="homeBox" class="card hidden">
    <h2 id="hello"></h2>
    <p class="muted" id="roleLine"></p>
    <p><a href="https://mindyjwu.github.io/zengxin-ops-portal/ltc-portal.html">前往營運入口（示範版）</a></p>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
